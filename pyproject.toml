[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firebird-maintenance-studio"
version = "0.1.0"
description = "Desktop maintenance workspace for Firebird databases"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "PySide6>=6.8,<7",
  "firebird-driver>=2.0,<3",
  "firebird-lib>=2.0,<3",
  "fdb>=2.0.4,<3",
  "keyring>=25,<26",
]

[project.scripts]
firebird-studio = "firebird_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["firebird_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
